$kind: http-request
url: "{{baseUrl}}/summary"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('back to baseline', () => pm.expect(pm.response.json().total_entries).to.eql(Number(pm.collectionVariables.get('baselineEntries'))));
    language: text/javascript
order: 11000
