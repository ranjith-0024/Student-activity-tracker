$kind: http-request
url: "{{baseUrl}}/activities"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "",
      "activity": "",
      "hours": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const e = pm.response.json().error;
      pm.test('field errors present', () => pm.expect(e.details).to.have.all.keys('name','activity','hours'));
    language: text/javascript
order: 3000
